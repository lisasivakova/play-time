<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Play Time</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Play Time">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="config.js"></script>
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
/* Layout: one phone column on white paper, black ink, red as the only accent; two cat mascots (LS black, SH white) — ink-outlined top bar, hand-drawn П mascot as hero, title + score bar, outlined boxes, a black sparkle CTA, a row of round tool buttons. Single deliberate light look. */
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#111111; --ink-2:#5C5C5C; --ink-3:#ABABAB; --line:#111111;
  --red:#111111; --red-soft:#EFEFEF;
  --display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
[hidden]{display:none!important}
.app{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* top bar */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.circ.white{background:#fff;color:var(--ink)}
.sq,.circ{width:44px;height:44px;border:2.5px solid var(--ink);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.sq{border-radius:13px}.circ{border-radius:50%;background:var(--ink);color:var(--paper);font:800 13px var(--mono)}
.sq svg{width:20px;height:20px}
.top .mid{text-align:center;display:flex;flex-direction:column;gap:1px}
.top .mid b{font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase}
.top .mid span{font:500 11.5px var(--mono);color:var(--ink-2)}

/* test strip */
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2.5px solid var(--ink);background:var(--red-soft);border-radius:16px;padding:8px 8px 8px 14px;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.strip button{border:2px solid var(--ink);background:var(--card);border-radius:99px;padding:6px 12px;font:700 11.5px var(--mono);cursor:pointer;color:var(--ink);text-transform:uppercase}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hero svg.mascot{width:min(250px,70vw);height:auto;display:block}
.hero h1{font:800 34px/1.05 var(--display);letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.hero .sub{font:500 13px var(--mono);color:var(--ink-2)}
.hero .sub b{color:var(--ink)}
.secret{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.word{font:800 22px var(--display);color:#fff;background:var(--red);border:2.5px solid var(--ink);border-radius:12px;padding:4px 14px;transform:rotate(-1.5deg)}
.link{background:none;border:0;font:700 12px var(--mono);color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}

/* score bar */
.scorebar{display:flex;flex-direction:column;gap:7px}
.track{height:20px;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;display:flex;background:var(--card)}
.track .ls{background:var(--ink);border-right:2.5px solid var(--ink)}
.track .sh{background:var(--card);flex:1}
.track.empty .ls{background:var(--card);border-right:2px dashed var(--ink-3)}.track.empty .sh{background:var(--card)}
.scorelabels{display:flex;justify-content:space-between;font:700 12.5px var(--mono);font-variant-numeric:tabular-nums}
.scorelabels .me{color:var(--red)}
.scorelabels .me::after{content:" · you";color:var(--ink-3);font-weight:500}
.tabs{display:flex;justify-content:center;gap:4px}
.tabs button{border:0;background:none;font:700 11px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:99px;cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--ink);background:var(--red-soft)}

/* boxes */
.box{border:2.5px solid var(--ink);border-radius:20px;background:var(--card);padding:6px 16px;display:flex;flex-direction:column}
.clue{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1.5px dashed var(--ink-3)}
.clue:last-child{border-bottom:0}
.clue .n{font:800 12px var(--mono);color:var(--ink-2)}
.clue .t{font:700 18px var(--display);letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.clue.locked .t{font:500 13px var(--mono);color:var(--ink-3)}
.guess{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:6px 0}
.guess .n{font:800 12px var(--mono);color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tag{font:700 14px var(--display);padding:4px 12px;border-radius:99px;border:2px solid var(--ink);background:var(--card);overflow-wrap:anywhere;text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2)}
.tag.hot{background:var(--red-soft);text-decoration:none;color:var(--ink)}
.tag.hot::after{content:" тепло";font:700 10px var(--mono);color:var(--ink-2)}
.tag.win{background:var(--red);border-color:var(--ink);text-decoration:none;color:#fff}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots span.used{background:var(--ink)}.dots span.win{background:var(--red)}

/* fields */
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{display:flex;justify-content:space-between;font:800 11.5px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.field label span{color:var(--ink-3);font-weight:500;text-transform:none;letter-spacing:0}
input[type=text],textarea.field-in{width:100%;resize:none;overflow:hidden;line-height:1.25;height:52px;display:block;font:700 18px var(--display);color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;outline:none}
input[type=text]::placeholder,textarea.field-in::placeholder{color:var(--ink-3);font-weight:500}
input[type=text]:focus,textarea.field-in:focus{box-shadow:4px 4px 0 var(--ink)}
input.bad{background:var(--red-soft);border-color:var(--red)}
.hint{font:500 11.5px var(--mono);min-height:16px;margin:0;color:var(--ink-2)}
.hint.bad{color:var(--red)}.hint.ok{color:var(--ink-2)}.hint.ok::before{content:"✓ "}

/* CTA */
.cta{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:17px 22px;cursor:pointer;font:800 13.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:transform .1s}
.cta svg{width:16px;height:16px;flex:none}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.3;cursor:default}
.cta.light{background:var(--card);color:var(--ink);border:2.5px solid var(--ink)}
button:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* tool row */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;justify-items:center}
.tool{width:100%;max-width:110px;aspect-ratio:1.25;border:2.5px solid var(--ink);border-radius:99px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink);font:700 10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.tool svg{width:30px;height:30px}

.wait{font:500 13px var(--mono);color:var(--ink-2);text-align:center}
.prev{background:var(--card);color:var(--ink-2);width:100%;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px dashed var(--ink-3);border-radius:16px;padding:10px 14px;font:500 12.5px var(--mono);color:var(--ink-2)}
.prev b{font:800 16px var(--display);color:var(--ink)}
.err{border:2.5px solid var(--ink);background:var(--red-soft);border-radius:16px;padding:10px 14px;font:500 13px var(--mono)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,18,16,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:var(--paper);border:2.5px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font:800 24px var(--display);margin:0;letter-spacing:-.02em}
.sheet p{margin:0;font-size:14.5px;line-height:1.5}
.x{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);font:800 16px var(--mono);cursor:pointer;color:var(--ink)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:800 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:0 0 6px;border-bottom:2.5px solid var(--ink)}
td{padding:9px 0;border-bottom:1.5px dashed var(--ink-3);font-size:14px}
.r{text-align:right}td.r{font:800 14px var(--mono);white-space:nowrap}
.hitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1.5px dashed var(--ink-3)}
.hitem .w{font:800 17px var(--display)}
.hitem .d,.hitem .c{font:500 12px var(--mono);color:var(--ink-2)}
.hitem .d{text-align:right}.hitem .c{grid-column:1/-1}

/* celebration */
.ov{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto;display:flex;flex-direction:column;align-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:fade .25s ease}
.ov .in{width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.ov svg.mascot{width:min(240px,62vw);height:auto;animation:hop .7s cubic-bezier(.3,1.6,.5,1) both}
.ov .kick{font:800 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.ov .big{font:800 clamp(40px,13vw,60px)/1 var(--display);letter-spacing:-.03em;overflow-wrap:anywhere}
.ov .big span{display:inline-block;animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.ov .pts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:2.5px solid var(--ink);border-radius:99px;padding:6px 14px;font:800 13px var(--mono);background:var(--card)}
.chip.lemon{background:var(--red);color:#fff}.chip.tomato{background:var(--ink);color:#fff}
.fact{width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:20px;background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:5px 5px 0 var(--red)}
.fact .k{font:800 11px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.fact p{margin:0;font:500 16px/1.45 var(--body)}
.fact .s{font:500 11px var(--mono);color:var(--ink-2)}
.sentclues{width:100%;text-align:left}
.login{min-height:calc(100vh - 80px);display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;text-align:center}
.login h1{font:800 40px/1 var(--display);letter-spacing:-.02em;margin:0}
.login .sub{font:500 13px var(--mono);color:var(--ink-2)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:0;width:100%}
.pick button{border:0;border-radius:24px;background:none;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);transition:transform .12s}
.pick button:hover{transform:translateY(-3px) rotate(-1deg)}
.pick button:active{transform:scale(.97)}
.pick button.black b{color:var(--ink)}
.pick button:disabled{opacity:.35;cursor:default;transform:none}
.pick svg{width:100%;height:auto}
.pick b{font:800 34px var(--display);letter-spacing:-.01em}
.pick span{font:500 12px var(--mono);opacity:.75}
.pick button.black svg{filter:invert(0)}

/* ---------- home ---------- */
.sq.ghost{border-color:transparent;background:none}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pl{border:2.5px solid var(--ink);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.pl.me{box-shadow:4px 4px 0 var(--ink)}
.plhead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.plhead .dot{width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--ink)}
.plhead .dot.white{background:#fff}
.crown{width:24px;height:18px;margin-left:auto}
.pl .pts{font-weight:800;font-size:40px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}
.pl .cap{font-size:12px;color:var(--ink-2)}
.hcat{display:flex;justify-content:center;margin:-6px 0 -10px}
.hcat svg{width:120px;height:auto}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-weight:800;font-size:22px;letter-spacing:-.02em;margin:6px 0 0}
.gsub{margin:-6px 0 2px;font-size:13px;color:var(--ink-2)}
.game{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:20px;background:var(--card);padding:14px 16px;cursor:pointer;color:var(--ink);font-family:var(--body)}
.game:active{transform:scale(.99)}
.gicon{width:40px;height:40px;flex:none;display:grid;place-items:center}
.gicon svg{width:40px;height:40px}
.gtext{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.gtext b{font-weight:800;font-size:18px;letter-spacing:-.01em}
.gtext span{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.glang{font-weight:800;font-size:12px;letter-spacing:.06em;border:2px solid var(--ink);border-radius:99px;padding:3px 8px}
.glang:empty{display:none}
/* ---------- wordle ---------- */
.wmsg{text-align:center;font-weight:700;font-size:14px;margin:0;min-height:20px}
.wgrid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:min(330px,100%);margin:0 auto}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wrow.shake{animation:shake .4s}
.wt{aspect-ratio:1;border:2.5px solid #d3d6da;display:grid;place-items:center;font-weight:800;font-size:28px;text-transform:uppercase;background:#fff;color:var(--ink)}
.wt.filled{border-color:#878a8c}
.wt.correct{background:#6aaa64;border-color:#6aaa64;color:#fff}
.wt.present{background:#c9b458;border-color:#c9b458;color:#fff}
.wt.absent{background:#787c7e;border-color:#787c7e;color:#fff}
.wt.flip{animation:flip .5s both}
.kb{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:40px;height:54px;border:0;border-radius:8px;background:#d3d6da;color:var(--ink);font:800 15px var(--body);cursor:pointer;padding:0;touch-action:manipulation}
.key.wide{max-width:64px;flex:1.6;font-size:12.5px}
.key.correct{background:#6aaa64;color:#fff}
.key.present{background:#c9b458;color:#fff}
.key.absent{background:#787c7e;color:#fff}
.wnext{text-align:center;color:var(--ink-2);font-size:14px;margin:4px 0}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
/* ---------- sudoku ---------- */
.sgrid{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid var(--ink);width:min(380px,100%);margin:0 auto;aspect-ratio:1;background:#fff}
.sc{border:0;border-right:1px solid #c9c9c9;border-bottom:1px solid #c9c9c9;background:#fff;font:500 22px var(--body);color:var(--ink);padding:0;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.sc.given{font-weight:800}
.sc:not(.given){color:#4a4a4a}
.sc.br{border-right:2.5px solid var(--ink)}.sc.bb{border-bottom:2.5px solid var(--ink)}
.sc:nth-child(9n){border-right:0}
.sc.peer{background:#f1f1f1}.sc.same{background:#dedede}.sc.sel{background:var(--ink);color:#fff}
.sc.bad{text-decoration:underline wavy;text-underline-offset:4px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(380px,100%);margin:0 auto}
.pad .key{max-width:none;height:52px;font-size:20px}
.link.center{align-self:center}
@media (prefers-reduced-motion:reduce){.wt.flip,.wrow.shake{animation:none!important}}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(.4em)}}
@keyframes hop{0%{transform:translateY(30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes twinkle{50%{transform:scale(.6) rotate(20deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.tw.b{animation-delay:.8s}.tw.c{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){.tw,.ov,.ov svg.mascot,.ov .big span,.scrim,.sheet{animation:none}}

/* Sketch */
.padwrap{border:2.5px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden;aspect-ratio:1;width:100%}
.skpad{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair;background:#fff}
.padtools{display:flex;gap:10px;justify-content:center}
.ptool{border:2px solid var(--ink);border-radius:99px;background:var(--card);padding:8px 18px;font:700 14px var(--display);color:var(--ink)}
.ptool:disabled{opacity:.35}
.frame{border:2.5px solid var(--ink);border-radius:20px;background:#fff;aspect-ratio:1;width:100%;overflow:hidden}
.frame.small{width:min(220px,60vw);border-radius:16px}
svg.sk{display:block;width:100%;height:100%}
svg.sk path{fill:none;stroke:#111;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 0}
svg.sk path[style]{stroke-dasharray:1 1}
@keyframes skdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){svg.sk path[style]{animation:none!important;stroke-dasharray:1 0}}
.blanks{display:inline-flex;gap:3px;vertical-align:middle}.blanks i{display:inline-block;width:9px;height:2.5px;background:var(--ink);border-radius:2px}
.dtags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dprev{align-items:center}.dprev svg.thumb path{stroke-width:24}.dprev svg.thumb{width:52px;height:52px;flex:none;border:1.5px solid var(--ink-3);border-radius:10px;background:#fff}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:6px}
.gallery svg{border:2px solid var(--ink);border-radius:14px;background:#fff;aspect-ratio:1}
.gallery figcaption{font:500 12px var(--mono);color:var(--ink-2);display:flex;flex-direction:column}
.gallery figcaption b{font:800 15px var(--display);color:var(--ink)}


button,.key,.cell{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.season{margin:0 0 -4px;font:600 12.5px var(--body);color:var(--ink-2);text-align:center}
.pl .cap{display:flex;align-items:center;gap:3px}
svg.mini{width:13px;height:10px;display:inline-block;vertical-align:-1px}
.wrival,.vs{margin:0;text-align:center;font:600 13.5px var(--body);color:var(--ink-2)}

/* wardrobe, prizes, wildcard, recap */
.hcat svg.mascot{height:170px;width:auto;max-width:100%}
.hbtns{display:flex;justify-content:center;margin-top:-6px}
.wbtn{border:2.5px solid var(--ink);border-radius:99px;background:var(--card);color:var(--ink);padding:8px 18px;font:800 14px var(--body)}
.prizebar{width:100%;border:2.5px solid var(--ink);border-radius:18px;background:var(--ink);color:#fff;padding:14px 16px;font:800 15px var(--body);text-align:left}
.wildline{margin:0;text-align:center;font:500 13px var(--body);color:var(--ink-2)}.wildline b{color:var(--ink)}
.game.wild{box-shadow:5px 5px 0 var(--ink)}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/[^а-яa-z\-\s]/g," ").trim();
const tokens=s=>norm(s).split(/\s+/).filter(Boolean);
const stemOf=w=>{w=norm(w);return w.slice(0,Math.max(3,w.length-2))};
const mskDate=(d=new Date())=>new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const dayNum=s=>Math.round(Date.parse(s+"T00:00:00Z")/864e5);
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const usedWords=G=>{const s=new Set();if(G&&G.rounds)for(const r of Object.values(G.rounds)){if(r.word)s.add(norm(r.word));(r.skipped||[]).forEach(w=>s.add(norm(w)))}return s};
const pickWord=(seed,n,G)=>{const h=hash("pe"+seed+"|"+n), hard=(h>>>3)%2===1, used=usedWords(G);
  let pool=(hard?WORDS_HARD:WORDS_EASY).filter(w=>!used.has(norm(w)));
  if(!pool.length) pool=WORDS.filter(w=>!used.has(norm(w)));
  if(!pool.length) pool=hard?WORDS_HARD:WORDS_EASY;
  return pool[hash("w"+seed+"|"+n)%pool.length]};
const fmtDayEn=s=>new Date(s+"T12:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"long",timeZone:"UTC"});

/* ---------- rules & points ---------- */
const PTS={guesser:[5,3,1], sniper:1, writerFirst:2, writerOneWord:3}; /* guesser scores; writer only when clue 1 lands */
const FUNC=new Set("по под подо про при пред перед передо после против посреди поверх позади помимо поперёк поперек подле путём путем пока покуда потому поскольку пусть пускай притом причём причем".split(" "));
function checkClue(text,word,others){
  const t=tokens(text);
  if(!t.length) return {ok:false,msg:""};
  const content=t.filter(w=>!FUNC.has(w));
  if(!content.length) return {ok:false,msg:"needs at least one word besides prepositions"};
  if(content.length>3) return {ok:false,msg:"3 words at most (prepositions don't count)"};
  const st=stemOf(word);
  for(const w of t){
    if(!/^п/.test(w)) return {ok:false,msg:`«${w}» doesn't start with П`};
    if(FUNC.has(w)) continue;
    if(w.length<2) return {ok:false,msg:`«${w}» is too short`};
    if(w.includes(st)||w.includes(norm(word))) return {ok:false,msg:`«${w}» shares a root with the word`};
    if(others.includes(w)) return {ok:false,msg:`«${w}» is already used`};
  }

function isHit(tok,word){word=norm(word);tok=norm(tok);return tok===word||(tok.startsWith(stemOf(word))&&Math.abs(tok.length-word.length)<=2)}

  const w={}; w[r.writer]=0; w[r.guesser]=0;
  if(r.status==="solved"){w[r.guesser]=PTS.guesser[r.solvedAt]+(tokens(r.guesses[r.solvedAt]).length===1?PTS.sniper:0);
    if(r.solvedAt===0) w[r.writer]=tokens((r.clues||[""])[0]).filter(x=>!FUNC.has(x)).length===1?PTS.writerOneWord:PTS.writerFirst}

  return id===G.me?S.myTag:(S.myTag==="LS"?"SH":"LS")}

function current(G=S.G){const l=roundsList(G);return l[l.length-1]}

function makeRound(n,G){
  const p=G.meta.players, writer=p[(n-1)%2], seed=G.meta.seed||"pe";
  return {n,writer,guesser:p.find(x=>x!==writer),word:pickWord(seed+"#"+n,0,G),rerolled:false,clues:null,guesses:[],status:"writing",solvedAt:null,startedAt:today(),endedAt:null};
}
function ensureCurrent(G=S.G){
  if(!G.meta||(G.meta.players||[]).length<2||G.creating) return;

/* ---------- scores across all games ---------- */
function pePoints(tag){let t=0;for(const r of roundsList(LIVE)){const s=scoreRound(r);t+=s[tag]||0}return t}
function soloPoints(tag){let t=0;for(const v of Object.values(LIVE.solo||{})){if(v.player===tag)t+=v.points||0}return t}
function totalPoints(tag){return weekPoints(tag,weekOf(today()))}
/* ---------- weekly seasons ---------- */
/* every point carries a date; scores reset each Monday (Moscow time), the week's winner takes a crown */
const weekOf=d=>{const n=dayNum(d);return n-((n+3)%7)}; /* day number of that week's Monday */
const SPTS=l=>(SUDOKU_LEVELS.find(x=>x.k===l)||{pts:0}).pts;
function wordleOf(tag,d){return (LIVE.solo||{})[soloId("wordle",d,tag)]}
const wTries=v=>v.status==="won"?v.guesses.length:7;
function wordleDuel(d){ /* +1 to whoever needed fewer tries, once both have played that day */
  const a=wordleOf("LS",d), b=wordleOf("SH",d); if(!a||!b) return null;
  const ta=wTries(a), tb=wTries(b); if(ta===tb||Math.min(ta,tb)>6) return {winner:null};
  return {winner:ta<tb?"LS":"SH"};
}
function ledgerFull(){
  const P=[], Q=[], add=(tag,pts,d,game)=>{if(pts&&d)P.push({tag,pts:pts*(game==="bonus"?1:xMult(game,d)),wk:weekOf(d),game})}, play=(tag,d,game)=>{if(d)Q.push({tag,wk:weekOf(d),game})};
  for(const v of Object.values(LIVE.solo||{})){
    if(v.kind==="sudoku"){add(v.player,SPTS(v.level),v.date,"sudoku");play(v.player,v.date,"sudoku")}
    if(v.kind==="wordle"){add(v.player,v.points||0,v.date,"wordle");play(v.player,v.date,"wordle")}
    if(v.kind==="bonus") add(v.player,v.points||0,v.date,"bonus");
  }
  const days=new Set(Object.values(LIVE.solo||{}).filter(v=>v.kind==="wordle").map(v=>v.date));
  for(const d of days){const w=wordleDuel(d); if(w&&w.winner) add(w.winner,1,d,"wordle")}
  for(const r of roundsList(LIVE)){if(r.status!=="solved"&&r.status!=="missed")continue;const d=r.endedAt||r.startedAt,s=scoreRound(r);for(const t in s)add(t,s[t],d,"pe");play(r.writer,d,"pe");play(r.guesser,d,"pe")}
  for(const r of drawList(LIVE)){if(r.status!=="solved"&&r.status!=="missed")continue;const d=r.endedAt||r.startedAt,s=scoreDraw(r);for(const t in s)add(t,s[t],d,"draw");play(r.drawer,d,"draw");play(r.guesser,d,"draw")}
  return {points:P,plays:Q};
}
function ledger(){return ledgerFull().points}
function weekPoints(tag,wk){let t=0;for(const e of ledger())if(e.tag===tag&&e.wk===wk)t+=e.pts;return t}
function crowns(){ /* finished weeks only; a tie gives no crown */
  const L=ledger(), now=weekOf(today()), weeks={};
  for(const e of L){if(e.wk>=now)continue;(weeks[e.wk]||(weeks[e.wk]={LS:0,SH:0}))[e.tag]+=e.pts}
  const c={LS:0,SH:0}; for(const w of Object.values(weeks)){if(w.LS>w.SH)c.LS++;else if(w.SH>w.LS)c.SH++}
  return c;
}
const daysLeft=()=>{const n=dayNum(today());return 6-((n+3)%7)};
const soloId=(kind,date,tag,level)=>kind==="wordle"?`w-${date}-${tag}`:`s-${date}-${level}-${tag}`;

  if(!pool.length) pool=[...DRAW_NOUNS,...DRAW_VERBS].filter(w=>!used.has(w));

function scoreDraw(r){

/* forgiving check: plurals, -ing/-ed, and one typo in longer words */
const dnorm=s=>String(s).toLowerCase().replace(/[^a-z]/g,"");

  const w=dnorm(word), all=[dnorm(guess),...String(guess).toLowerCase().split(/[^a-z]+/).filter(Boolean)];
  return all.some(g=>g&&(g===w||dstem(g)===dstem(w)||(w.length>=5&&lev1(g,w))));

function paintCanvas(){

const dTries=r=>`<div class="dots" aria-label="Tries">${[0,1,2,3,4].map(i=>`<span class="${r.status==="solved"&&r.solvedAt===i?"win":i<r.guesses.length?"used":""}"></span>`).join("")}</div>`;

/* ---------- wardrobe: 12 items, 2 worn at a time ---------- */
const ITEMS=["sunglasses","iqos","iphone","pendant","perfume","sword","ball","drink","kinder","burger","beba","bacon"];
const ITEM_NAME={sunglasses:"Sunglasses",iqos:"IQOS",iphone:"iPhone",pendant:"Pendant",perfume:"Perfume",sword:"Sword",ball:"8-ball",drink:"Coffee",kinder:"Kinder",burger:"Burger",beba:"Beba",bacon:"Bacon"};
const itemName=(k,who)=>k==="drink"?(who==="SH"?"Matcha":"Coffee"):ITEM_NAME[k];
const itemLow=(k,who)=>["iqos","iphone","beba","bacon","kinder"].includes(k)?itemName(k,who):itemName(k,who).toLowerCase();
const W_GAP=7, W_LEFT=72-W_GAP, W_RIGHT=158+W_GAP; /* cat body starts at x 72, the tail reaches x ~157 */
function dressParts(who,keys){
  const b=who==="LS"; let out="", used={L:false,R:false}, minX=0, maxX=200;
  for(const k of keys){
    if(WORN[k]){out+=WORN[k](b);continue}
    const g=GROUND[k]; if(!g) continue; let side=g.side; if(used[side]) side=side==="L"?"R":"L"; used[side]=true;
    const x=side==="L"?W_LEFT-g.w:W_RIGHT;
    out+=`<g transform="translate(${x} 176)">${g.f(b,side)}</g>`;
    minX=Math.min(minX,x-4); maxX=Math.max(maxX,x+g.w+4);
  }
  return {out,minX,maxX};
}
/* the cat with its items; the frame widens only as much as the items need */
function dressedCat(who,keys,mode="idle"){
  const {out,minX,maxX}=dressParts(who,keys||[]), half=Math.max(100,100-minX,maxX-100);
  return mascot(mode,who).replace('viewBox="0 0 200 200"',`viewBox="${100-half} 18 ${2*half} 166" data-wide="${half>100?1:0}"`).replace('</svg>',out+'</svg>');
}
const ITEM_BOX={sunglasses:[64,56,72,30],iqos:[98,44,76,56],pendant:[78,96,44,36],bacon:[66,28,62,34]};
const GROUND_H={perfume:48,drink:66,ball:25,burger:31,iphone:48,sword:84,kinder:50,beba:40};
function itemThumb(k,who){
  const b=who==="LS";
  if(WORN[k]){const [x,y,w,h]=ITEM_BOX[k],m=Math.max(w,h)+6,cx=x+w/2,cy=y+h/2;return `<svg viewBox="${cx-m/2} ${cy-m/2} ${m} ${m}" aria-hidden="true">${WORN[k](false)}</svg>`}
  const g=GROUND[k],H=GROUND_H[k],m=Math.max(g.w,H)+8;
  return `<svg viewBox="${g.w/2-m/2} ${-H/2-m/2} ${m} ${m}" aria-hidden="true">${g.f(b,"L")}</svg>`;
}
const wardOf=tag=>(LIVE.ward||{})[tag]||{kind:"wardrobe",player:tag,owned:[],wearing:[]};
function allTimePoints(tag){let t=0;for(const e of ledger())if(e.tag===tag)t+=e.pts;return t}
function prizeState(tag){
  const w=wardOf(tag), pts=allTimePoints(tag), earned=crowns()[tag]+Math.floor(pts/100);
  const picks=Math.max(0,Math.min(ITEMS.length-w.owned.length,earned-w.owned.length));
  return {picks,pts,nextAt:(Math.floor(pts/100)+1)*100,owned:w.owned,wearing:w.wearing};
}
async function saveWard(tag,data){
  const v={kind:"wardrobe",player:tag,owned:data.owned,wearing:data.wearing};
  (LIVE.ward||(LIVE.ward={}))[tag]=v; render();
  try{await FB.save("wr-"+tag,v)}catch(e){S.err="Couldn't save your wardrobe. Check the connection.";render()}
}

function wearTap(k){
  const me=S.choice, ps=prizeState(me); if(!ps.owned.includes(k)) return;

function takeItem(){
  const me=S.choice, ps=prizeState(me), k=WSel.pick; if(!k||!ps.picks||ps.owned.includes(k)) return;

  WSel.pick=null; saveWard(me,{owned,wearing});

/* ---------- weekly recap for the winner ---------- */
function weekRecap(wk){
  const L=ledgerFull(), out={LS:{total:0,games:{}},SH:{total:0,games:{}}};
  for(const t of ["LS","SH"]) for(const g of Object.keys(GAME_NAMES)) out[t].games[g]={played:0,pts:0};
  for(const e of L.points) if(e.wk===wk){out[e.tag].total+=e.pts;if(out[e.tag].games[e.game])out[e.tag].games[e.game].pts+=e.pts}
  for(const p of L.plays) if(p.wk===wk) out[p.tag].games[p.game].played++;
  return out;
}
function recapDue(){
  const me=S.choice, wk=weekOf(today())-7, r=weekRecap(wk);
  if(r[me].total<=r[me==="LS"?"SH":"LS"].total) return null;
  let seen=null; try{seen=localStorage.getItem(`pt.recap.${wk}.${me}`)}catch(e){}
  return seen&&!S.forceRecap?null:{wk,r};
}
function showRecap(rc){
  const me=S.choice, other=me==="LS"?"SH":"LS", mine=rc.r[me], theirs=rc.r[other], cr=crowns();
  try{localStorage.setItem(`pt.recap.${rc.wk}.${me}`,"1")}catch(e){}

/* ---------- Wordle ---------- */
const W_START=dayNum("2026-10-31");
const W_ORDER=(()=>{const a=[...W_ANS];let h=hash("playtime-wordle");for(let i=a.length-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a})();
const W_VALID=new Set((()=>{const o=[];for(let i=0;i<W_VALID_STR.length;i+=5)o.push(W_VALID_STR.slice(i,i+5));return o})().concat(W_ANS));
const wordOfDay=d=>W_ORDER[((dayNum(d)-W_START)%W_ORDER.length+W_ORDER.length)%W_ORDER.length];
const wKey=d=>`pt.w.${d}.${S.choice}`;
function wLoad(d){const done=soloDone("wordle",d,S.choice);if(done)return done.guesses;try{return JSON.parse(localStorage.getItem(wKey(d))||"[]")}catch(e){return []}}
function wSave(d,g){try{localStorage.setItem(wKey(d),JSON.stringify(g))}catch(e){}}
function wScore(guess,ans){ /* NYT rules: greens first, then yellows only for letters still unused */
  const res=Array(5).fill("absent"), left={};
  for(let i=0;i<5;i++){if(guess[i]===ans[i])res[i]="correct";else left[ans[i]]=(left[ans[i]]||0)+1}
  for(let i=0;i<5;i++){if(res[i]==="correct")continue;if(left[guess[i]]){res[i]="present";left[guess[i]]--}}
  return res;
}
const W={cur:"",msg:"",shake:false,justRow:-1};
function wordleScreen(){
  const d=today(), ans=wordOfDay(d), g=wLoad(d), done=soloDone("wordle",d,S.choice), over=!!done||g.includes(ans)||g.length>=6;
  let rows="";
  for(let r=0;r<6;r++){
    const word=r<g.length?g[r]:(r===g.length&&!over?W.cur:""), sc=r<g.length?wScore(g[r],ans):null;
    const flip=sc&&r===W.justRow; /* only the row just submitted flips */
    rows+=`<div class="wrow" data-r="${r}">${[0,1,2,3,4].map(i=>`<div class="wt ${sc?sc[i]:word[i]?"filled":""} ${flip?"flip":""}" style="${flip?`animation-delay:${i*110}ms`:""}">${esc((word[i]||"").toUpperCase())}</div>`).join("")}</div>`;
  }
  const best={};g.forEach(x=>wScore(x,ans).forEach((s,i)=>{const L=x[i],rank={correct:3,present:2,absent:1};if(!best[L]||rank[s]>rank[best[L]])best[L]=s}));
  const KB=["qwertyuiop","asdfghjkl","+zxcvbnm-"].map(row=>`<div class="krow">${[...row].map(k=>k==="+"?`<button class="key wide" data-k="enter">Enter</button>`:k==="-"?`<button class="key wide" data-k="back" aria-label="Delete">⌫</button>`:`<button class="key ${best[k]||""}" data-k="${k}">${k.toUpperCase()}</button>`).join("")}</div>`).join("");
  W.justRow=-1;
  const other=S.choice==="LS"?"SH":"LS", ow=wordleOf(other,d), duel=done&&wordleDuel(d);
  const rival=!done?"":!ow?`${other} hasn't played yet`:
    `${other} ${ow.status==="won"?`solved it in ${ow.guesses.length}`:"didn't get it"}`+(duel?(duel.winner===S.choice?" · you win today, +1":duel.winner?` · ${other} wins today, +1`:" · a tie"):"");
  const status=done?(done.status==="won"?`Solved in ${done.guesses.length} · +${done.points}`:`The word was ${ans.toUpperCase()}`):W.msg||"Guess the five-letter word in six tries";

/* typing only repaints the current row and the message; the whole screen redraws on Enter */

function wKeyPress(k){

/* ---------- Sudoku ---------- */
const SUDOKU_LEVELS=[{k:"easy",name:"Easy",givens:40,pts:1},{k:"medium",name:"Medium",givens:32,pts:2},{k:"hard",name:"Hard",givens:26,pts:3}];
function rng(seed){let a=hash(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sCount(g,limit=2){ /* counts solutions up to limit, bitmask solver */
  const row=Array(9).fill(0),col=Array(9).fill(0),box=Array(9).fill(0),empty=[];
  for(let i=0;i<81;i++){const v=g[i],r=i/9|0,c=i%9,b=(r/3|0)*3+(c/3|0);if(v){const m=1<<v;row[r]|=m;col[c]|=m;box[b]|=m}else empty.push(i)}
  let n=0;
  const go=k=>{if(n>=limit)return;if(k===empty.length){n++;return}
    let best=-1,bm=0,bc=10;for(let e=k;e<empty.length;e++){const i=empty[e],r=i/9|0,c=i%9,b=(r/3|0)*3+(c/3|0),m=~(row[r]|col[c]|box[b])&0x3FE;let cnt=0;for(let x=m;x;x&=x-1)cnt++;if(cnt<bc){bc=cnt;best=e;bm=m;if(cnt<=1)break}}
    if(bc===0)return;[empty[k],empty[best]]=[empty[best],empty[k]];const i=empty[k],r=i/9|0,c=i%9,b=(r/3|0)*3+(c/3|0);
    for(let v=1;v<=9;v++){const m=1<<v;if(!(bm&m))continue;row[r]|=m;col[c]|=m;box[b]|=m;go(k+1);row[r]&=~m;col[c]&=~m;box[b]&=~m;if(n>=limit)break}
    [empty[k],empty[best]]=[empty[best],empty[k]]};
  go(0);return n;
}
const sCache={};
function sudokuFor(d,level){
  const key=d+level; if(sCache[key]) return sCache[key];
  const R=rng("playtime-sudoku|"+key), sol=Array(81).fill(0);
  const fill=i=>{if(i===81)return true;const r=i/9|0,c=i%9,ds=[1,2,3,4,5,6,7,8,9].sort(()=>R()-.5);
    for(const v of ds){let ok=true;for(let k=0;k<9&&ok;k++){if(sol[r*9+k]===v||sol[k*9+c]===v)ok=false}
      const br=(r/3|0)*3,bc=(c/3|0)*3;for(let a=0;a<3&&ok;a++)for(let b=0;b<3&&ok;b++)if(sol[(br+a)*9+bc+b]===v)ok=false;
      if(ok){sol[i]=v;if(fill(i+1))return true;sol[i]=0}}return false};
  fill(0);
  const L=SUDOKU_LEVELS.find(x=>x.k===level), puz=[...sol], order=[...Array(81).keys()].sort(()=>R()-.5);
  let givens=81;
  for(const i of order){if(givens<=L.givens)break;const keep=puz[i];puz[i]=0;if(sCount([...puz])!==1)puz[i]=keep;else givens--}
  return sCache[key]={puz,sol};
}
const SS={level:null,sel:-1};
const sKey=(d,l)=>`pt.s.${d}.${l}.${S.choice}`;
function sLoad(d,l){try{return JSON.parse(localStorage.getItem(sKey(d,l))||"null")}catch(e){return null}}
function sSave(d,l,v){try{localStorage.setItem(sKey(d,l),JSON.stringify(v))}catch(e){}}
function sudokuScreen(){
  const d=today();
  if(!SS.level){
    const lv=SUDOKU_LEVELS.map(l=>{const done=soloDone("sudoku",d,S.choice,l.k);
      return `<button class="game" data-level="${l.k}"><span class="gtext"><b>${l.name}</b><span>${done?`Solved today · +${SUDOKU_LEVELS.find(x=>x.k===l.k).pts}`:`+${l.pts} points`}</span></span><span class="glang">${done?"✓":"→"}</span></button>`}).join("");
    return topBar("Sudoku",fmtDayEn(d))+errBox()+`<div class="hero"><h1>Pick a level</h1><span class="sub">a new puzzle every day · the same for both of you</span></div><section class="group">${lv}</section>`;
  }
  const {puz,sol}=sudokuFor(d,SS.level), done=soloDone("sudoku",d,S.choice,SS.level);
  const cur=done?sol:(sLoad(d,SS.level)||[...puz]);
  const selV=SS.sel>=0?cur[SS.sel]:0, sr=SS.sel/9|0, sc=SS.sel%9;
  let cells="";
  for(let i=0;i<81;i++){const r=i/9|0,c=i%9,v=cur[i],given=!!puz[i];
    let conflict=false;if(v&&!given){for(let k=0;k<81;k++){if(k===i||cur[k]!==v)continue;const kr=k/9|0,kc=k%9;if(kr===r||kc===c||((kr/3|0)===(r/3|0)&&(kc/3|0)===(c/3|0))){conflict=true;break}}}
    const cls=["sc",given?"given":"",i===SS.sel?"sel":"",SS.sel>=0&&(r===sr||c===sc||((r/3|0)===(sr/3|0)&&(c/3|0)===(sc/3|0)))?"peer":"",selV&&v===selV?"same":"",conflict?"bad":"",c%3===2&&c<8?"br":"",r%3===2&&r<8?"bb":""].filter(Boolean).join(" ");
    cells+=`<button class="${cls}" data-cell="${i}" aria-label="Row ${r+1} column ${c+1}${v?", "+v:""}">${v||""}</button>`}
  const L=SUDOKU_LEVELS.find(x=>x.k===SS.level);
  const pad=done?`<p class="wnext">Solved · +${SPTS(SS.level)}. A new one tomorrow.</p><p class="wrival">${(()=>{const o=S.choice==="LS"?"SH":"LS";return soloDone("sudoku",d,o,SS.level)?`${o} solved this one too`:`${o} hasn't solved this one yet`})()}</p>`:`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-num="${n}">${n}</button>`).join("")}<button class="key" data-num="0" aria-label="Erase">⌫</button></div>`;
  return topBar("Sudoku",`${L.name} · ${fmtDayEn(d)}`)+errBox()+`<div class="sgrid">${cells}</div>${pad}<button class="link center" data-level="">other levels</button>`;
}
function sInput(n){

/* ---------- celebration screens ---------- */
/* Daily pools: one literature line per day (Wordle) and one Zen line per day (Sudoku), the same for both players.
   Each pool is shuffled once with a fixed seed and walked day by day, so nothing repeats until the whole pool is used (365+ days). */
const seededOrder=(n,seed)=>{const a=[...Array(n).keys()];let h=hash(seed);for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const LIT_ORDER=seededOrder(LIT.length,"playtime-lit"), FACT_ORDER=seededOrder(FACTS.length,"playtime-facts");
const dayIdx=(n)=>(((dayNum(today())-W_START)%n)+n)%n;
const litOfDay=()=>LIT[LIT_ORDER[dayIdx(LIT.length)]];
const SQ={easy:["Haiku",HAIKU,"playtime-haiku"],medium:["Zen",ZEN,"playtime-zen"],hard:["Old wisdom",WISDOM,"playtime-wisdom"]};
const SQ_ORDER={};for(const k in SQ)SQ_ORDER[k]=seededOrder(SQ[k][1].length,SQ[k][2]);
/* each Sudoku level has its own pool: a different line per level, every day, no repeats within a pool */
const quoteOfDay=lk=>{const [label,list]=SQ[lk]||SQ.medium;return [label,list[SQ_ORDER[lk in SQ?lk:"medium"][dayIdx(list.length)]]]};
const ART_ORDER=seededOrder(ART.length,"playtime-art");
function nextArt(){let i=0;try{i=parseInt(localStorage.getItem("pt.art.i")||"0",10)||0}catch(e){}
  const q=ART[ART_ORDER[i%ART.length]];try{localStorage.setItem("pt.art.i",String((i+1)%ART.length))}catch(e){}return q}
/* Facts: each phone walks the whole shuffled list before anything comes back. */
function nextFact(){
  let i=0;try{i=parseInt(localStorage.getItem("pt.fact.i")||"0",10)||0}catch(e){}
  const f=FACTS[FACT_ORDER[i%FACTS.length]];
  try{localStorage.setItem("pt.fact.i",String((i+1)%FACTS.length))}catch(e){}
  return f;
}

  document.querySelectorAll("[data-takeoff]").forEach(b=>b.onclick=()=>{const ps=prizeState(S.choice);saveWard(S.choice,{owned:ps.owned,wearing:ps.wearing.filter(x=>x!==b.dataset.takeoff)})});
  document.querySelectorAll("[data-tas]").forEach(b=>b.onclick=()=>testSwitch(b.dataset.tas));
  document.querySelectorAll("[data-tact]").forEach(b=>b.onclick=()=>testAct(b.dataset.tact));
  document.querySelectorAll("[data-treset]").forEach(b=>b.onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith("pt.")).forEach(k=>{if(k!=="pt.test")localStorage.removeItem(k)})}catch(e){}location.reload()});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-sheet]").forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>wKeyPress(b.dataset.k));
  document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{SS.level=b.dataset.level||null;SS.sel=-1;render();scrollTo(0,0)});
  document.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>{SS.sel=+b.dataset.cell;render()});
  document.querySelectorAll("[data-num]").forEach(b=>b.onclick=()=>sInput(+b.dataset.num));
  document.querySelectorAll("[data-clue]").forEach(inp=>inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();inp.blur()}});
  document.querySelectorAll("[data-clue]").forEach(inp=>inp.oninput=()=>{if(/\n/.test(inp.value))inp.value=inp.value.replace(/\n/g," ");S.drafts["c"+inp.closest("[data-round]").dataset.round][+inp.dataset.clue]=inp.value;validateAll()});
  document.querySelectorAll("[data-guess]").forEach(inp=>{const n=inp.closest("[data-round]").dataset.round;
    inp.oninput=()=>{S.drafts["g"+n]=inp.value};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();doGuess(n)}}});
  document.querySelectorAll("[data-dguess]").forEach(inp=>{const n=inp.dataset.dguess;
    inp.oninput=()=>{if(/\n/.test(inp.value))inp.value=inp.value.replace(/\n/g," ");S.drafts["dg"+n]=inp.value};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();doDrawGuess(n)}}});
  document.querySelectorAll("[data-act]").forEach(b=>{if(b.dataset.act==="ovclose")return;if(/^d(undo|clear|reroll|send|guess)$/.test(b.dataset.act)){b.onclick=()=>drawAct(b.dataset.act,b.dataset.n);return}if(b.dataset.act==="takeitem"){b.onclick=takeItem;return}b.onclick=()=>{
    const n=b.dataset.n||b.closest("[data-round]")?.dataset.round, a=b.dataset.act, r=n&&roundOf(n);
    if(a==="reroll"){const k=(r.rerolls??(r.rerolled?1:0))+1; if(k<=2) saveRound({...r,word:pickWord((LIVE.meta.seed||"pe")+"#"+r.n,k,LIVE),skipped:[...(r.skipped||[]),r.word],rerolls:k,rerolled:true},LIVE)}
    if(a==="send"){const cl=S.drafts["c"+n].map(c=>tokens(c).join(" ")).filter(Boolean);saveRound({...r,clues:cl,status:"guessing"},LIVE);showOverlay({kind:"sent",clues:cl})}
    if(a==="guess") doGuess(n);
  }});
}
document.addEventListener("keydown",e=>{ /* hardware keyboard for Wordle and Sudoku */
  if(document.activeElement&&document.activeElement.tagName==="TEXTAREA") return;
  if(!$("#ov").hidden) return;
  if(S.screen==="wordle"){if(e.key==="Enter")wKeyPress("enter");else if(e.key==="Backspace")wKeyPress("back");else if(/^[a-zA-Z]$/.test(e.key))wKeyPress(e.key.toLowerCase())}
  if(S.screen==="sudoku"&&SS.level){if(/^[1-9]$/.test(e.key))sInput(+e.key);else if(e.key==="Backspace"||e.key==="0")sInput(0)}
});
function doGuess(n){
  const r=roundOf(n), inp=document.getElementById("g-"+n), all=tokens(inp.value);
  if(!all.length) return;
  if(all.length>3){const h=document.getElementById("gh-"+n);h.textContent="three words at most";h.className="hint bad";return}
  const guesses=[...r.guesses,all.join(" ")], i=guesses.length-1, next={...r,guesses};
  if(all.some(w=>isHit(w,r.word))){next.status="solved";next.solvedAt=i;next.endedAt=today()}
  else if(guesses.length>=3){next.status="missed";next.endedAt=today()}
  S.drafts["g"+n]="";
  if(next.status!=="guessing"){const sc=scoreRound(next);
    showOverlay({kind:next.status==="solved"?"won":"lost",word:r.word,at:i,sniper:next.status==="solved"&&all.length===1,mine:sc[r.guesser],theirs:sc[r.writer],otherName:r.writer})}
  saveRound(next,LIVE).then(()=>ensureCurrent(LIVE));
}

/* ---------- storage: Supabase (the app), the artifact's own store (preview), or this device only ---------- */
const store={get(){try{return localStorage.getItem("peshka.cat")}catch(e){return null}},
  set(v){try{v?localStorage.setItem("peshka.cat",v):localStorage.removeItem("peshka.cat")}catch(e){}}};
const FB={mode:null,lkey:"pt.local",lkey:"pt.local",url:null,key:null,code:"playtime",db:null,
  async init(){
    if(window.PT_TEST){this.mode="local";this.lkey="pt.testdb";this.code="test";return true}
    const cfg=window.PLAYTIME_CONFIG||{};
    if(cfg.supabaseUrl&&cfg.supabaseKey&&!String(cfg.supabaseUrl).includes("ВСТАВЬ")){
      this.mode="supabase"; this.url=String(cfg.supabaseUrl).trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,""); this.key=String(cfg.supabaseKey).trim();
      this.code=(cfg.gameCode||"playtime").replace(/[^A-Za-z0-9_-]/g,""); return true}
    const c=window.claude; let db=null;
    if(c&&c.use){try{db=await Promise.race([c.use("db"),new Promise(r=>setTimeout(()=>r(null),8000))])}catch(e){}}
    if(db){this.mode="artifact";this.db=db;return true}
    this.mode="local"; return true;
  },
  h(){const o={apikey:this.key,"Content-Type":"application/json"}; if(/^eyJ/.test(this.key)) o.Authorization="Bearer "+this.key; return o},
  async save(id,r){
    if(this.mode==="supabase"){const res=await fetch(this.url+"/rest/v1/rounds?on_conflict=game,id",{method:"POST",headers:{...this.h(),Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({game:this.code,id,data:r})});
      if(!res.ok) throw new Error("save "+res.status); return}
    if(this.mode==="artifact"){await this.db.doc("rounds/"+id).set(r);return}
    let all={};try{all=JSON.parse(localStorage.getItem(this.lkey)||"{}")}catch(e){} all[id]=r; try{localStorage.setItem(this.lkey,JSON.stringify(all))}catch(e){}
  },
  watch(cb,err){
    if(this.mode==="artifact"){this.db.collection("rounds").onSnapshot(s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e=>err&&err(e));return}
    if(this.mode==="local"){let all={};try{all=JSON.parse(localStorage.getItem(this.lkey)||"{}")}catch(e){} setTimeout(()=>cb({docs:Object.entries(all).map(([id,v])=>({id,data:()=>v}))}),0);return}
    const pull=async()=>{try{
      const res=await fetch(this.url+"/rest/v1/rounds?select=id,data&game=eq."+encodeURIComponent(this.code),{headers:this.h(),cache:"no-store"});
      if(!res.ok) throw {code:"HTTP "+res.status};
      const rows=await res.json(); cb({docs:rows.map(x=>({id:x.id,data:()=>x.data}))});
    }catch(e){err&&err(e)}};
    pull(); setInterval(()=>{if(!document.hidden)pull()},4000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
  }
};
function pickCat(tag){S.err="";S.choice=tag;S.myTag=tag;store.set(tag);LIVE.me=tag;S.screen="home";render();scrollTo(0,0)}
async function saveRound(r,G=LIVE){
  G.rounds[rid(r.n)]=r; render();
  try{await FB.save(rid(r.n),r)}catch(e){S.err="Couldn't save the move. Check the connection and try again.";render()}
}
function startLive(){
  LIVE.me=S.choice; LIVE.meta={players:["LS","SH"],tags:{LS:"LS",SH:"SH"},seed:FB.code}; LIVE.solo={}; LIVE.draws={}; LIVE.ward={};
  S.liveOk=true; S.G=LIVE; S.view="ready";
  let got=false; const timer=setTimeout(()=>{if(!got){S.err="No connection to the database. Check the internet.";render()}},10000);
  let lastSig="";
  FB.watch(snap=>{got=true;clearTimeout(timer);S.loaded=true;const hadErr=!!S.err;if(S.err.startsWith("No connection")||S.err.startsWith("The database"))S.err="";
      const sig=JSON.stringify(snap.docs.map(d=>[d.id,d.data()]).sort((x,y)=>x[0]<y[0]?-1:1));
      if(sig===lastSig&&!hadErr) return; lastSig=sig;
      LIVE.rounds={};LIVE.solo={};LIVE.draws={};LIVE.ward={};snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(v.kind==="wardrobe")LIVE.ward[v.player]=v;else if(v.kind==="draw")LIVE.draws[d.id]=v;else if(typeof v.n==="number")LIVE.rounds[d.id]=v;else if(v.kind)LIVE.solo[d.id]=v});
      if(LIVE.me&&S.screen==="pe") ensureCurrent(LIVE); if(LIVE.me&&S.screen==="draw") ensureDraw(LIVE); render()},
    e=>{S.err="The database isn't responding ("+(e&&e.code||"no connection")+"). Check the internet and config.js.";render()});
  render();
}
(()=>{const c=store.get(); if(c==="LS"||c==="SH"){S.choice=c;S.myTag=c}})();
if(window.PT_TEST&&!S.choice){S.choice="LS";S.myTag="LS"}

S.screen="home";
(async()=>{await FB.init(); startLive()})();
</script>
