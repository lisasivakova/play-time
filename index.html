<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Play Time</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Play Time">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="config.js"></script>
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
/* Layout: one phone column on white paper, black ink, red as the only accent; two cat mascots (LS black, SH white) — ink-outlined top bar, hand-drawn П mascot as hero, title + score bar, outlined boxes, a black sparkle CTA, a row of round tool buttons. Single deliberate light look. */
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#111111; --ink-2:#5C5C5C; --ink-3:#ABABAB; --line:#111111;
  --red:#111111; --red-soft:#EFEFEF;
  --display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
[hidden]{display:none!important}
.app{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* top bar */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.circ.white{background:#fff;color:var(--ink)}
.sq,.circ{width:44px;height:44px;border:2.5px solid var(--ink);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.sq{border-radius:13px}.circ{border-radius:50%;background:var(--ink);color:var(--paper);font:800 13px var(--mono)}
.sq svg{width:20px;height:20px}
.top .mid{text-align:center;display:flex;flex-direction:column;gap:1px}
.top .mid b{font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase}
.top .mid span{font:500 11.5px var(--mono);color:var(--ink-2)}

/* test strip */
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2.5px solid var(--ink);background:var(--red-soft);border-radius:16px;padding:8px 8px 8px 14px;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.strip button{border:2px solid var(--ink);background:var(--card);border-radius:99px;padding:6px 12px;font:700 11.5px var(--mono);cursor:pointer;color:var(--ink);text-transform:uppercase}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hero svg.mascot{width:min(250px,70vw);height:auto;display:block}
.hero h1{font:800 34px/1.05 var(--display);letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.hero .sub{font:500 13px var(--mono);color:var(--ink-2)}
.hero .sub b{color:var(--ink)}
.secret{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.word{font:800 22px var(--display);color:#fff;background:var(--red);border:2.5px solid var(--ink);border-radius:12px;padding:4px 14px;transform:rotate(-1.5deg)}
.link{background:none;border:0;font:700 12px var(--mono);color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}

/* score bar */
.scorebar{display:flex;flex-direction:column;gap:7px}
.track{height:20px;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;display:flex;background:var(--card)}
.track .ls{background:var(--ink);border-right:2.5px solid var(--ink)}
.track .sh{background:var(--card);flex:1}
.track.empty .ls{background:var(--card);border-right:2px dashed var(--ink-3)}.track.empty .sh{background:var(--card)}
.scorelabels{display:flex;justify-content:space-between;font:700 12.5px var(--mono);font-variant-numeric:tabular-nums}
.scorelabels .me{color:var(--red)}
.scorelabels .me::after{content:" · ты";color:var(--ink-3);font-weight:500}
.tabs{display:flex;justify-content:center;gap:4px}
.tabs button{border:0;background:none;font:700 11px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:99px;cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--ink);background:var(--red-soft)}

/* boxes */
.box{border:2.5px solid var(--ink);border-radius:20px;background:var(--card);padding:6px 16px;display:flex;flex-direction:column}
.clue{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1.5px dashed var(--ink-3)}
.clue:last-child{border-bottom:0}
.clue .n{font:800 12px var(--mono);color:var(--ink-2)}
.clue .t{font:700 18px var(--display);letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.clue.locked .t{font:500 13px var(--mono);color:var(--ink-3)}
.guess{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:6px 0}
.guess .n{font:800 12px var(--mono);color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tag{font:700 14px var(--display);padding:4px 12px;border-radius:99px;border:2px solid var(--ink);background:var(--card);overflow-wrap:anywhere;text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2)}
.tag.hot{background:var(--red-soft);text-decoration:none;color:var(--ink)}
.tag.hot::after{content:" тепло";font:700 10px var(--mono);color:var(--ink-2)}
.tag.win{background:var(--red);border-color:var(--ink);text-decoration:none;color:#fff}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots span.used{background:var(--ink)}.dots span.win{background:var(--red)}

/* fields */
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{display:flex;justify-content:space-between;font:800 11.5px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.field label span{color:var(--ink-3);font-weight:500;text-transform:none;letter-spacing:0}
input[type=text],textarea.field-in{width:100%;resize:none;overflow:hidden;line-height:1.25;height:52px;display:block;font:700 18px var(--display);color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;outline:none}
input[type=text]::placeholder,textarea.field-in::placeholder{color:var(--ink-3);font-weight:500}
input[type=text]:focus,textarea.field-in:focus{box-shadow:4px 4px 0 var(--ink)}
input.bad{background:var(--red-soft);border-color:var(--red)}
.hint{font:500 11.5px var(--mono);min-height:16px;margin:0;color:var(--ink-2)}
.hint.bad{color:var(--red)}.hint.ok{color:var(--ink-2)}.hint.ok::before{content:"✓ "}

/* CTA */
.cta{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:17px 22px;cursor:pointer;font:800 13.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:transform .1s}
.cta svg{width:16px;height:16px;flex:none}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.3;cursor:default}
.cta.light{background:var(--card);color:var(--ink);border:2.5px solid var(--ink)}
button:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* tool row */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;justify-items:center}
.tool{width:100%;max-width:110px;aspect-ratio:1.25;border:2.5px solid var(--ink);border-radius:99px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--ink);font:700 10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.tool svg{width:30px;height:30px}

.wait{font:500 13px var(--mono);color:var(--ink-2);text-align:center}
.prev{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px dashed var(--ink-3);border-radius:16px;padding:10px 14px;font:500 12.5px var(--mono);color:var(--ink-2)}
.prev b{font:800 16px var(--display);color:var(--ink)}
.err{border:2.5px solid var(--ink);background:var(--red-soft);border-radius:16px;padding:10px 14px;font:500 13px var(--mono)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,18,16,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:var(--paper);border:2.5px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font:800 24px var(--display);margin:0;letter-spacing:-.02em}
.sheet p{margin:0;font-size:14.5px;line-height:1.5}
.x{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);font:800 16px var(--mono);cursor:pointer;color:var(--ink)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:800 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:0 0 6px;border-bottom:2.5px solid var(--ink)}
td{padding:9px 0;border-bottom:1.5px dashed var(--ink-3);font-size:14px}
.r{text-align:right}td.r{font:800 14px var(--mono);white-space:nowrap}
.hitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1.5px dashed var(--ink-3)}
.hitem .w{font:800 17px var(--display)}
.hitem .d,.hitem .c{font:500 12px var(--mono);color:var(--ink-2)}
.hitem .d{text-align:right}.hitem .c{grid-column:1/-1}

/* celebration */
.ov{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto;display:flex;flex-direction:column;align-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:fade .25s ease}
.ov .in{width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.ov svg.mascot{width:min(240px,62vw);height:auto;animation:hop .7s cubic-bezier(.3,1.6,.5,1) both}
.ov .kick{font:800 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.ov .big{font:800 clamp(40px,13vw,60px)/1 var(--display);letter-spacing:-.03em;overflow-wrap:anywhere}
.ov .big span{display:inline-block;animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.ov .pts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:2.5px solid var(--ink);border-radius:99px;padding:6px 14px;font:800 13px var(--mono);background:var(--card)}
.chip.lemon{background:var(--red);color:#fff}.chip.tomato{background:var(--ink);color:#fff}
.fact{width:100%;text-align:left;border:2.5px solid var(--ink);border-radius:20px;background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:5px 5px 0 var(--red)}
.fact .k{font:800 11px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.fact p{margin:0;font:500 16px/1.45 var(--body)}
.fact .s{font:500 11px var(--mono);color:var(--ink-2)}
.sentclues{width:100%;text-align:left}
.login{min-height:calc(100vh - 80px);display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;text-align:center}
.login h1{font:800 40px/1 var(--display);letter-spacing:-.02em;margin:0}
.login .sub{font:500 13px var(--mono);color:var(--ink-2)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:0;width:100%}
.pick button{border:0;border-radius:24px;background:none;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);transition:transform .12s}
.pick button:hover{transform:translateY(-3px) rotate(-1deg)}
.pick button:active{transform:scale(.97)}
.pick button.black b{color:var(--ink)}
.pick button:disabled{opacity:.35;cursor:default;transform:none}
.pick svg{width:100%;height:auto}
.pick b{font:800 34px var(--display);letter-spacing:-.01em}
.pick span{font:500 12px var(--mono);opacity:.75}
.pick button.black svg{filter:invert(0)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(.4em)}}
@keyframes hop{0%{transform:translateY(30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes twinkle{50%{transform:scale(.6) rotate(20deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.tw.b{animation-delay:.8s}.tw.c{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){.tw,.ov,.ov svg.mascot,.ov .big span,.scrim,.sheet{animation:none}}
</style>

</head>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/[^а-яa-z\-\s]/g," ").trim();
const tokens=s=>norm(s).split(/\s+/).filter(Boolean);
const stemOf=w=>{w=norm(w);return w.slice(0,Math.max(3,w.length-2))};
const mskDate=(d=new Date())=>new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const dayNum=s=>Math.round(Date.parse(s+"T00:00:00Z")/864e5);
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const EASY_N=120; /* first 120 words are the easy set, the rest are harder */
const pickWord=(seed,n)=>{const h=hash("pe"+seed+"|"+n), hard=(h>>>3)%2===1;
  const lo=hard?EASY_N:0, hi=hard?WORDS.length:EASY_N; return WORDS[lo+h%(hi-lo)]};
const fmtDay=s=>new Date(s+"T12:00:00Z").toLocaleDateString("ru-RU",{day:"numeric",month:"long",timeZone:"UTC"});
function extraFor(){ /* a random fact, avoiding the last 20 shown on this device */
  let seen=[];try{seen=JSON.parse(localStorage.getItem("playtime.seen")||"[]")}catch(e){}
  let pool=EXTRAS.map((_,k)=>k).filter(k=>!seen.includes(k)); if(!pool.length) pool=EXTRAS.map((_,k)=>k);
  const k=pool[Math.floor(Math.random()*pool.length)];
  try{localStorage.setItem("playtime.seen",JSON.stringify([...seen,k].slice(-20)))}catch(e){}
  return EXTRAS[k];
}

/* ---------- rules & points ---------- */
const PTS={guesser:[5,3,1], sniper:1, writerFirst:2, writerOneWord:3}; /* guesser scores; writer only when clue 1 lands */
const FUNC=new Set("по под подо про при пред перед передо после против посреди поверх позади помимо поперёк поперек подле путём путем пока покуда потому поскольку пусть пускай притом причём причем".split(" "));
function checkClue(text,word,others){
  const t=tokens(text);
  if(!t.length) return {ok:false,msg:""};
  const content=t.filter(w=>!FUNC.has(w));
  if(!content.length) return {ok:false,msg:"Нужно хотя бы одно слово кроме предлогов"};
  if(content.length>3) return {ok:false,msg:"Максимум 3 слова (предлоги не считаются)"};
  const st=stemOf(word);
  for(const w of t){
    if(!/^п/.test(w)) return {ok:false,msg:`«${w}» не на П`};
    if(FUNC.has(w)) continue;
    if(w.length<2) return {ok:false,msg:`«${w}» слишком короткое`};
    if(w.includes(st)||w.includes(norm(word))) return {ok:false,msg:`«${w}» однокоренное с загаданным`};
    if(others.includes(w)) return {ok:false,msg:`«${w}» уже было`};
  }
  return {ok:true,msg:"всё на П",words:content};
}
function isHit(tok,word){word=norm(word);tok=norm(tok);return tok===word||(tok.startsWith(stemOf(word))&&Math.abs(tok.length-word.length)<=2)}
function isHot(tok,word){return !isHit(tok,word)&&norm(tok).slice(0,3)===norm(word).slice(0,3)}
function scoreRound(r){
  const w={}; w[r.writer]=0; w[r.guesser]=0;
  if(r.status==="solved"){w[r.guesser]=PTS.guesser[r.solvedAt]+(tokens(r.guesses[r.solvedAt]).length===1?PTS.sniper:0);
    if(r.solvedAt===0) w[r.writer]=tokens((r.clues||[""])[0]).filter(x=>!FUNC.has(x)).length===1?PTS.writerOneWord:PTS.writerFirst}
  return w;
}

const S={choice:null,myTag:"LS",view:"loading",G:LIVE,tab:"week",db:null,user:null,drafts:{},err:"",flash:null,liveOk:false};
const today=()=>mskDate();
const rid=n=>"r"+String(n).padStart(4,"0");
function nameOf(id){const G=S.G;if(G.meta?.tags?.[id]) return G.meta.tags[id];if(G.mode==="test") return id==="ls"?"LS":"SH";
  return id===G.me?S.myTag:(S.myTag==="LS"?"SH":"LS")}
const nameIn=nameOf;
function roundsList(G=S.G){return Object.values(G.rounds).filter(r=>typeof r.n==="number").sort((a,b)=>a.n-b.n)}
function current(G=S.G){const l=roundsList(G);return l[l.length-1]}

async function saveRound(r,G=S.G){
  G.rounds[rid(r.n)]=r; render();
  if(G.mode!=="live") return;
  try{await FB.save(rid(r.n),r)}catch(e){S.err="Не получилось сохранить ход. Проверь интернет и попробуй ещё раз.";render()}
}
function makeRound(n,G){
  const p=G.meta.players, writer=p[(n-1)%2], seed=G.meta.seed||"pe";
  return {n,writer,guesser:p.find(x=>x!==writer),word:pickWord(seed+"#"+n,0),rerolled:false,clues:null,guesses:[],status:"writing",solvedAt:null,startedAt:today(),endedAt:null};
}
function ensureCurrent(G=S.G){
  if(!G.meta||(G.meta.players||[]).length<2||G.creating) return;
  const c=current(G);
  if(!c||c.status==="solved"||c.status==="missed"){G.creating=true;saveRound(makeRound(c?c.n+1:1,G),G).finally(()=>G.creating=false)}
}

/* ---------- render ---------- */
function totals(){
  const G=S.G,t={},wk={};(G.meta?.players||[]).forEach(p=>{t[p]=0;wk[p]=0});
  const now=today(),dn=dayNum(now),monday=dn-(new Date(now+"T12:00:00Z").getUTCDay()+6)%7;
  for(const r of roundsList()){const s=scoreRound(r),d=r.endedAt||r.startedAt;for(const k in s){if(k in t){t[k]+=s[k];if(d&&dayNum(d)>=monday)wk[k]+=s[k]}}}
  return S.tab==="week"?wk:t;
}
function idByTag(tag){const G=S.G;return (G.meta?.players||[]).find(p=>nameOf(p)===tag)}
function scoreBar(){
  const t=totals(), ls=idByTag("LS"), sh=idByTag("SH"), a=ls?t[ls]||0:0, b=sh?t[sh]||0:0, sum=a+b;
  const w=sum?Math.max(6,Math.min(94,a/sum*100)):50, me=nameOf(S.G.me);
  return `<div class="scorebar"><div class="track ${sum?"":"empty"}" role="img" aria-label="LS ${a}, SH ${b}"><div class="ls" style="width:${w}%"></div><div class="sh"></div></div>
    <div class="scorelabels"><span class="${me==="LS"?"me":""}">LS ${a}</span><span class="${me==="SH"?"me":""}">SH ${b}</span></div>
    <div class="tabs"><button data-tab="week" aria-pressed="${S.tab==="week"}">неделя</button><button data-tab="all" aria-pressed="${S.tab==="all"}">всё время</button></div></div>`;
}
function cluesBox(r,reveal){
  const cl=r.clues||[], more=cl.length<3&&reveal>cl.length&&r.status==="guessing";
  return `<div class="box">${cl.map((c,i)=>i<reveal
    ?`<div class="clue"><span class="n">0${i+1}</span><span class="t">${esc(c)}</span></div>`
    :`<div class="clue locked"><span class="n">0${i+1}</span><span class="t">скрыто</span></div>`).join("")}${more?`<div class="clue locked"><span class="n">—</span><span class="t">больше подсказок нет</span></div>`:""}${r.guesses.length?r.guesses.map((g,i)=>`<div class="guess"><span class="n">${i+1}</span><div class="tags">${g.split(" ").map(w=>{
    const c=isHit(w,r.word)?"win":isHot(w,r.word)?"hot":"";return `<span class="tag ${c}">${esc(w)}</span>`}).join("")}</div></div>`).join(""):""}</div>`;
}
const dots=r=>`<div class="dots" aria-label="Попытки">${[0,1,2].map(i=>`<span class="${r.status==="solved"&&r.solvedAt===i?"win":i<r.guesses.length?"used":""}"></span>`).join("")}</div>`;

function tools(){return `<div class="tools"><button class="tool" data-sheet="rules">${ICON.scroll}Правила</button><button class="tool" data-sheet="history">${ICON.cup}История</button></div>`}

function stage(r){
  const me=S.G.me,isW=me===r.writer,isG=me===r.guesser;
  if(!isW&&!isG) return {m:"wait",h:`<h1>${esc(nameOf(r.writer))} → ${esc(nameOf(r.guesser))}</h1>`,b:""};
  if(isW&&!r.clues){
    const k="c"+r.n, d=S.drafts[k]||(S.drafts[k]=["","",""]);
    return {m:"write",round:r.n,h:`<h1>Загадай слово</h1><div class="secret"><span class="word">${esc(r.word)}</span>${(r.rerolls??(r.rerolled?1:0))>=2?"":`<button class="link" data-act="reroll" data-n="${r.n}">другое слово · осталось ${2-(r.rerolls??(r.rerolled?1:0))}</button>`}</div>
      <span class="sub">до 3 слов в подсказке · всё на «П» · предлоги не считаются</span>`,
      b:`<div class="fields">${[0,1,2].map(i=>`<div class="field"><label for="c-${r.n}-${i}">Подсказка 0${i+1}<span>${i?"по желанию":"обязательно"}</span></label>
        <textarea class="field-in" id="c-${r.n}-${i}" data-clue="${i}" name="pt-clue-${i}-x" rows="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-autocomplete="none" data-1p-ignore data-lpignore="true" placeholder="${["пушистая привереда","птичек преследует","подоконник предпочитает"][i]}">${esc(d[i])}</textarea>
        <p class="hint" id="h-${r.n}-${i}"></p></div>`).join("")}</div>${cta("send","Отправить",true)}`};
  }
  if(isW) return {m:"wait",h:`<h1>Ждём ${esc(nameOf(r.guesser))}</h1><span class="sub">твоё слово: <b>${esc(r.word)}</b></span>${dots(r)}`,b:cluesBox(r,3)};
  if(!r.clues) return {m:"wait",h:`<h1>${esc(nameOf(r.writer))} пишет</h1><span class="sub">подсказки скоро будут</span>`,b:""};
  const n=r.guesses.length;
  return {m:"guess",round:r.n,h:`<h1>Отгадай слово</h1><span class="sub">попытка <b>${n+1}</b> из 3 · до 3 слов</span>${dots(r)}`,
    b:cluesBox(r,n+1)+`<div class="field"><label for="g-${r.n}">Твой вариант<span>одним словом +1</span></label>
      <textarea class="field-in" id="g-${r.n}" data-guess name="pt-guess-x" rows="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-autocomplete="none" data-1p-ignore data-lpignore="true" placeholder="кошка кот котёнок">${esc(S.drafts["g"+r.n]||"")}</textarea><p class="hint"></p></div>${cta("guess","Проверить")}`};
}

  if(S.view==="loading") return;
  const G=S.G, app=$("#app");
  if(!S.choice&&!(G.mode==="live"&&!G.meta)){app.innerHTML=loginScreen();bind();return}
  const strip="";
  const err=S.err&&G.mode==="live"?`<div class="err">${esc(S.err)}</div>`:"";
  if(G.mode==="live"&&!G.meta){app.innerHTML=topBar()+`<div class="hero">${mascot("wait",nameOf(S.G.me))}<h1>Открываем…</h1></div>`;return}
  const players=G.meta?.players||[];
  if(G.mode==="live"&&!players.includes(G.me)&&players.length<2){app.innerHTML=loginScreen();bind();return}
  if(G.mode==="live"&&!players.includes(G.me)){
    const free=players.length<2;
    app.innerHTML=topBar()+err+`<div class="hero">${mascot(free?"idle":"wait",S.myTag)}<h1>${free?"Сыграем?":"Тут уже двое"}</h1>
      <span class="sub">${free?"первые двое, кто нажмёт, играют":"только просмотр"}</span></div>${free?cta("join","Играть"):""}${tools()}`;
    bind(); return;
  }
  if(players.length<2){
    app.innerHTML=topBar()+strip+err+`<div class="hero">${mascot("wait",nameOf(S.G.me))}<h1>Ждём ${S.myTag==="LS"?"SH":"LS"}</h1><span class="sub">отправь ссылку</span></div>${tools()}`;
    bind(); return;
  }
  const c=current(G), l=roundsList(G), prev=l.length>1?l[l.length-2]:null;
  if(!c){app.innerHTML=topBar()+`<div class="hero">${mascot("idle",nameOf(S.G.me))}<h1>Достаём слово…</h1></div>`;return}
  const st=stage(c);
  app.innerHTML=topBar(c.n)+strip+err+`<div class="hero">${mascot(st.m,nameOf(S.G.me))}${st.h}</div>`+
    (st.round?`<div data-round="${st.round}" style="display:flex;flex-direction:column;gap:16px">${st.b}</div>`:st.b)+
    scoreBar()+prevLine(prev)+tools();
  bind(); validateAll();
}

/* ---------- sheets ---------- */
function openSheet(kind){
  const el=$("#sheet"); let h="";
  if(kind==="rules") h=`<div class="hd"><h2>Правила</h2><button class="x" data-close aria-label="Закрыть">✕</button></div>
    <p>Ходы по очереди, без таймера. В каждом раунде одно слово загадывают, другое — отгадывают, в следующем раунде роли меняются.</p>
    <p><b>Подсказки:</b> 1–3, в каждой до 3 слов, все на «П». Предлоги и союзы на «П» (по, под, про, при, пока, пусть…) не считаются. Слово можно заменить 2 раза.</p>
    <p><b>Догадки:</b> 3 попытки, до 3 слов в каждой. Промах открывает следующую подсказку.</p>
    <table><thead><tr><th>За отгадку</th><th class="r">Очки</th></tr></thead><tbody>
      <tr><td>С 1-й попытки</td><td class="r">+${PTS.guesser[0]}</td></tr><tr><td>Со 2-й</td><td class="r">+${PTS.guesser[1]}</td></tr>
      <tr><td>С 3-й</td><td class="r">+${PTS.guesser[2]}</td></tr><tr><td>Одним словом</td><td class="r">+${PTS.sniper}</td></tr></tbody></table>
    <table><thead><tr><th>За подсказки</th><th class="r">Очки</th></tr></thead><tbody>
      <tr><td>Отгадка с 1-й подсказки</td><td class="r">+${PTS.writerFirst}</td></tr><tr><td>…если в ней одно слово</td><td class="r">+${PTS.writerOneWord}</td></tr>
      <tr><td>Иначе</td><td class="r">0</td></tr></tbody></table>`;
  if(kind==="history"){
    const list=roundsList().filter(r=>r.status==="solved"||r.status==="missed").reverse().slice(0,50);
    h=`<div class="hd"><h2>История</h2><button class="x" data-close aria-label="Закрыть">✕</button></div>`+(list.length?list.map(r=>{const s=scoreRound(r);return `<div class="hitem">
      <span class="w">${esc(r.word)}${r.status==="missed"?" ✕":""}</span><span class="d">№${r.n} · ${fmtDay(r.endedAt||r.startedAt)}</span>
      <span class="c">${(r.clues||[]).map(esc).join(" / ")}</span>
      <span class="c">${esc(nameOf(r.guesser))} +${s[r.guesser]}${s[r.writer]?` · ${esc(nameOf(r.writer))} +${s[r.writer]}`:""}</span></div>`}).join(""):`<p>Пока пусто.</p>`);
  }
  el.innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;
  el.hidden=false; bind();
  el.querySelector("[data-scrim]").onclick=e=>{if(e.target.hasAttribute("data-scrim"))closeSheet()};
}
function closeSheet(){const el=$("#sheet");el.hidden=true;el.innerHTML=""}

/* ---------- celebration screens ---------- */
function showOverlay(o){
  const el=$("#ov"); let h="";
  const letters=w=>[...w].map((c,i)=>`<span style="animation-delay:${200+i*45}ms">${esc(c)}</span>`).join("");
  if(o.kind==="sent"){
    const line=extraFor(today(),o.me);
    h=`${mascot("win",nameOf(S.G.me))}<span class="kick">Подсказки улетели</span><div class="big">${letters("Готово!")}</div>
      <div class="box sentclues">${o.clues.map((c,i)=>`<div class="clue"><span class="n">0${i+1}</span><span class="t">${esc(c)}</span></div>`).join("")}</div>
      <div class="fact"><span class="k">Факт</span><p>${esc(line[0])}</p><span class="s">${esc(line[1])}</span></div>`;
  } else if(o.kind==="won"){
    h=`${mascot("win",nameOf(S.G.me))}<span class="kick">С ${o.at+1}-й попытки${o.sniper?" · одним словом":""}</span><div class="big">${letters(o.word)}</div>
      <div class="pts"><span class="chip lemon">тебе +${o.mine}</span>${o.theirs?`<span class="chip tomato">${esc(o.otherName)} +${o.theirs}</span>`:""}</div>`;
  } else {
    h=`${mascot("lose",nameOf(S.G.me))}<span class="kick">Не угадано</span><div class="big">${letters(o.word)}</div><div class="pts"><span class="chip">+0 · следующий ход твой</span></div>`;
  }
  el.innerHTML=`<div class="in">${h}${cta("ovclose","Дальше")}</div>`;
  el.hidden=false; document.body.style.overflow="hidden";
  const b=el.querySelector('[data-act="ovclose"]');
  b.onclick=()=>{el.hidden=true;el.innerHTML="";document.body.style.overflow="";scrollTo(0,0)};
  b.focus({preventScroll:true});
}

/* ---------- interactions ---------- */
const roundOf=n=>S.G.rounds[rid(+n)];
function validateAll(){
  document.querySelectorAll("[data-round]").forEach(sec=>{
    const r=roundOf(sec.dataset.round); if(!r||r.clues) return;
    let allOk=true; const used=[];
    sec.querySelectorAll("[data-clue]").forEach((inp,i)=>{
      const empty=!tokens(inp.value).length, res=(i>0&&empty)?{ok:true,msg:"",words:[]}:checkClue(inp.value,r.word,used), hint=document.getElementById(`h-${r.n}-${i}`);
      if(i===0&&empty) allOk=false;
      if(res.ok) used.push(...res.words); else allOk=false;
      hint.textContent=res.msg; hint.className="hint "+(res.ok&&res.msg?"ok":res.msg?"bad":"");
      inp.classList.toggle("bad",!res.ok&&!!res.msg);
    });
    const b=sec.querySelector('[data-act="send"]'); if(b) b.disabled=!allOk;
  });
}
function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>pickCat(b.dataset.pick));
  document.querySelectorAll("[data-sheet]").forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  document.querySelectorAll("[data-clue]").forEach(inp=>inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();inp.blur()}});
  document.querySelectorAll("[data-clue]").forEach(inp=>inp.oninput=()=>{if(/\n/.test(inp.value))inp.value=inp.value.replace(/\n/g," ");S.drafts["c"+inp.closest("[data-round]").dataset.round][+inp.dataset.clue]=inp.value;validateAll()});
  document.querySelectorAll("[data-guess]").forEach(inp=>{const n=inp.closest("[data-round]").dataset.round;
    inp.oninput=()=>{S.drafts["g"+n]=inp.value};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();doGuess(n)}}});
  document.querySelectorAll("[data-act]").forEach(b=>{if(b.dataset.act==="ovclose")return;b.onclick=()=>{
    const n=b.dataset.n||b.closest("[data-round]")?.dataset.round, a=b.dataset.act, r=n&&roundOf(n);
    if(a==="join") join();
    if(a==="test"){if(!S.choice){S.choice=S.myTag||"LS"} if(!TEST.meta) resetTest(); S.G=TEST; closeSheet(); render(); scrollTo(0,0)}
    if(a==="exit"){S.G=LIVE; closeSheet(); render(); scrollTo(0,0)}
    if(a==="reset"){resetTest(); Object.keys(S.drafts).forEach(k=>delete S.drafts[k]); closeSheet(); render()}
    if(a==="swap"){TEST.me=TEST.me==="ls"?"sh":"ls"; closeSheet(); render(); scrollTo(0,0)}
    if(a==="reroll"){const k=(r.rerolls??(r.rerolled?1:0))+1; if(k<=2) saveRound({...r,word:pickWord((S.G.meta.seed||"pe")+"#"+r.n,k),rerolls:k,rerolled:true})}
    if(a==="send"){const cl=S.drafts["c"+n].map(c=>tokens(c).join(" ")).filter(Boolean);saveRound({...r,clues:cl,status:"guessing"});showOverlay({kind:"sent",clues:cl,me:S.G.me})}
    if(a==="guess") doGuess(n);
  }});
}
function doGuess(n){
  const G=S.G, r=roundOf(n), inp=document.getElementById("g-"+n), all=tokens(inp.value);
  if(!all.length) return;
  if(all.length>3){const h=inp.nextElementSibling;h.textContent="максимум три слова";h.className="hint bad";return}
  const guesses=[...r.guesses,all.join(" ")], i=guesses.length-1, next={...r,guesses};
  if(all.some(w=>isHit(w,r.word))){next.status="solved";next.solvedAt=i;next.endedAt=today()}
  else if(guesses.length>=3){next.status="missed";next.endedAt=today()}
  S.drafts["g"+n]="";
  if(next.status!=="guessing"){const sc=scoreRound(next);
    showOverlay({kind:next.status==="solved"?"won":"lost",word:r.word,at:i,sniper:next.status==="solved"&&all.length===1,mine:sc[r.guesser],theirs:sc[r.writer],otherName:nameOf(r.writer)})}
  saveRound(next,G).then(()=>ensureCurrent(G));
}

/* ---------- test mode (local, both sides) ---------- */
function resetTest(){
  TEST.me=S.choice==="SH"?"sh":"ls"; TEST.names={}; TEST.rounds={}; TEST.creating=false;
  TEST.meta={players:["ls","sh"],tags:{ls:"LS",sh:"SH"},seed:"test"+Date.now()};
  ensureCurrent(TEST);
}

/* ---------- live (Supabase) ---------- */
const store={get(){try{return localStorage.getItem("peshka.cat")}catch(e){return null}},
  set(v){try{v?localStorage.setItem("peshka.cat",v):localStorage.removeItem("peshka.cat")}catch(e){}}};
const FB={url:null,key:null,code:null,timer:null,
  /* Supabase REST: one table "rounds" (game, id, data). Polls every 4 s and when the app comes back to the screen. */
  async init(){
    const cfg=window.PLAYTIME_CONFIG||{};
    if(!cfg.supabaseUrl||!cfg.supabaseKey||String(cfg.supabaseUrl).includes("ВСТАВЬ")) return false;
    this.url=String(cfg.supabaseUrl).trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,""); this.key=String(cfg.supabaseKey).trim();
    this.code=(cfg.gameCode||"playtime").replace(/[^A-Za-z0-9_-]/g,""); return true;
  },
  /* new-style keys (sb_publishable_…) go only in "apikey"; old JWT anon keys (eyJ…) also go in Authorization */
  h(){const o={apikey:this.key,"Content-Type":"application/json"}; if(/^eyJ/.test(this.key)) o.Authorization="Bearer "+this.key; return o},
  async save(id,r){
    const res=await fetch(this.url+"/rest/v1/rounds?on_conflict=game,id",{method:"POST",headers:{...this.h(),Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({game:this.code,id,data:r})});
    if(!res.ok) throw new Error("save "+res.status);
  },
  watch(cb,err){
    const pull=async()=>{try{
      const res=await fetch(this.url+"/rest/v1/rounds?select=id,data&game=eq."+encodeURIComponent(this.code),{headers:this.h(),cache:"no-store"});
      if(!res.ok) throw {code:"HTTP "+res.status};
      const rows=await res.json(); cb({docs:rows.map(x=>({id:x.id,data:()=>x.data}))});
    }catch(e){err&&err(e)}};
    pull(); this.timer=setInterval(()=>{if(!document.hidden)pull()},4000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
  }
};
function pickCat(tag){
  S.err=""; S.choice=tag; S.myTag=tag; store.set(tag);
  LIVE.me=tag; TEST.me=tag==="LS"?"ls":"sh";
  if(S.liveOk) ensureCurrent(LIVE);
  render(); scrollTo(0,0);
}
async function join(){ render() }
function startLive(){
  LIVE.me=S.choice; LIVE.meta={players:["LS","SH"],tags:{LS:"LS",SH:"SH"},seed:FB.code};
  S.liveOk=true; S.G=LIVE; S.view="ready";
  let got=false; const timer=setTimeout(()=>{if(!got){S.err="Нет связи с базой. Проверь интернет.";render()}},10000);
  let lastSig="";
  FB.watch(snap=>{got=true;clearTimeout(timer);const hadErr=!!S.err;if(S.err.startsWith("Нет связи")||S.err.startsWith("База не отвечает"))S.err="";
      const sig=JSON.stringify(snap.docs.map(d=>[d.id,d.data()]).sort((x,y)=>x[0]<y[0]?-1:1));
      if(sig===lastSig&&!hadErr) return; lastSig=sig;
      LIVE.rounds={};snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.n==="number")LIVE.rounds[d.id]=v});
      if(LIVE.me) ensureCurrent(LIVE); render()},
    e=>{S.err="База не отвечает ("+(e&&e.code||"нет связи")+"). Проверь интернет и config.js.";render()});
  render();
}
function startTestOnly(){resetTest(); S.G=TEST; S.view="ready"; render()}
(()=>{const c=store.get(); if(c==="LS"||c==="SH"){S.choice=c;S.myTag=c}})();
(async()=>{
  let ok=false; try{ok=await FB.init()}catch(e){ok=false}
  if(ok) startLive();
  else document.getElementById("app").innerHTML=`<div class="login"><h1>Play Time</h1><p class="sub" style="max-width:30ch;line-height:1.5">Приложение ещё не подключено к базе. Заполни файл config.js по инструкции и загрузи его на GitHub заново.</p></div>`;
})();
</script>
